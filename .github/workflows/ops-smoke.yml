name: Ops rehearsal

# Runs the provisioning and deployment scripts for real on a throwaway runner, with PostgreSQL,
# systemd and the same layout as the server. Takes several minutes, so it only runs when those
# scripts change, or by hand. It never contacts any AuditISA server.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/provision/**"
      - "deploy/**"
      - ".github/ci/ops-smoke.sh"
      - ".github/workflows/ops-smoke.yml"

concurrency:
  group: ops-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-odoo

      - name: Rehearse new_firm, backup_firm and deploy-staging
        run: sudo -E bash .github/ci/ops-smoke.sh
